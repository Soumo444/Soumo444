name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # every day at midnight UTC
  workflow_dispatch:        # allows manual run from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate Matrix-style snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Soumo444
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF41,#00FF41,#00FF41,#00FF41,#00FF41&color_dots=#0d1117,#003b00,#00ff41,#00ff41,#00ff41&color_empty=#0d1117&gradient=false

      - name: Push SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
